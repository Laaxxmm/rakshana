# Explicit Nixpacks plan for Railway.
#
# Why we override the default:
#   - Default Node detection on Railway gives us Node 18, which can't parse
#     a package-lock.json generated by npm 11 (lockfileVersion 3 with new
#     fields).
#   - Default install command is `npm ci`, which is strict — any drift in
#     the lockfile bails with a usage dump instead of recovering. We use
#     `npm install --legacy-peer-deps` so a peer-dep warning doesn't
#     fail the build.
#   - We force the install phase to run `prisma generate` (the package's
#     postinstall script does this, but redundancy here makes failure
#     modes easier to diagnose in Railway logs).
#   - `ghostscript` is in nixPkgs for the `gs` binary `compressPdf`
#     (src/lib/images/compress.ts) shells out to. It is needed at runtime, not
#     just at build: without it an uploaded PDF bill is stored at its upload
#     size instead of a few hundred KB. Uploads still succeed when it is
#     absent, which is what lets local dev run without it.
#
# IMPORTANT: `prisma migrate deploy` does NOT run here. Railway only
# injects DATABASE_URL at runtime, not at build time, so migrations would
# crash with "Environment variable not found: DATABASE_URL". Migrations
# are owned by `deploy.preDeployCommand` in railway.json — that runs
# after build with full access to runtime env vars.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl", "ghostscript"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps --include=dev",
  "npx prisma generate",
]

[phases.build]
cmds = [
  "npx next build",
]

[start]
cmd = "npm run start"
